name: Terraform CI

on:
  push:
    branches:
      - main
      - "week11-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize for validation
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: Initialize TFLint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infrastructure
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  terraform:
    name: Terraform plan or manual operation
    needs: checks
    if: github.repository == 'Dmitriy-O/webserver-ec2-module-terraform' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    concurrency:
      group: week11-webserver-state
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        shell: bash
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Initialize S3 backend
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -no-color -out=plan.tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -no-color plan.tfplan

      - name: Install Go for Terratest
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: test/go.sum

      - name: Run post-apply Terratest
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        working-directory: test
        run: go test -v -count=1 -timeout 10m ./...

      - name: Create destroy plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -no-color -out=destroy.tfplan

      - name: Upload destroy plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: destroy-plan-${{ github.run_id }}
          path: infrastructure/destroy.tfplan
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  destroy:
    name: Destroy after approval
    needs: terraform
    if: github.repository == 'Dmitriy-O/webserver-ec2-module-terraform' && github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: terraform-destroy

    concurrency:
      group: week11-webserver-state
      cancel-in-progress: false

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        shell: bash
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Download approved destroy plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: destroy-plan-${{ github.run_id }}
          path: infrastructure

      - name: Initialize S3 backend
        run: terraform init -input=false -lockfile=readonly

      - name: Apply approved destroy plan
        run: terraform apply -input=false -no-color destroy.tfplan

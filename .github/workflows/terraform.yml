name: Terraform AWS

run-name: Terraform ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

      confirm:
        description: Type destroy to confirm infrastructure deletion
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-week11
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}

jobs:
  terraform:
    if: github.repository == vars.DEPLOY_REPOSITORY && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check destroy confirmation
        if: inputs.operation == 'destroy' && inputs.confirm != 'destroy'
        run: |
          echo "Enter destroy in the confirm field to delete infrastructure."
          exit 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: Initialize TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --format compact

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2

      - name: Scan Terraform configuration
        run: trivy config --exit-code 1 .

      - name: Terraform plan
        if: inputs.operation == 'plan' || inputs.operation == 'apply'
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Terraform apply
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Terraform destroy plan
        if: inputs.operation == 'destroy'
        run: terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=destroy.tfplan

      - name: Terraform destroy
        if: inputs.operation == 'destroy'
        run: terraform apply -input=false -no-color -lock-timeout=5m destroy.tfplan


name: Terraform Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.tflint.hcl'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint
        run: tflint --config=../.tflint.hcl --init

      - name: Run TFLint
        run: tflint --config=../.tflint.hcl --minimum-failure-severity=warning

  trivy-scan:
    name: Trivy Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            aquasec/trivy:0.65.0 \
            fs \
            --scanners misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /work/infrastructure

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [tflint, trivy-scan]

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_admin_ip: ${{ secrets.TF_VAR_admin_ip }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/tfplan
          retention-days: 1

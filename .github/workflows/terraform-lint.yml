
name: Terraform Lint

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.tflint.hcl'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.tflint.hcl'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint
        run: tflint --config=../.tflint.hcl --init

      - name: Run TFLint
        run: tflint --config=../.tflint.hcl --minimum-failure-severity=warning

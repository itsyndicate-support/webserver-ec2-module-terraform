
name: Terraform Security Scan

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read


jobs:
  trivy-scan:
    name: Trivy Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            aquasec/trivy:0.65.0 \
            fs \
            --scanners misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /work/infrastructure
